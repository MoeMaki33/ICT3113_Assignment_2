name: A2 unit tests
on:
  push:
    branches: [assignment2-implementation]
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/a2_*.py'
      - 'requirements.txt'
      - '.github/workflows/a2-unit-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syntax and run unit tests
        run: |
          python -m compileall -q app scripts tests
          python -m pytest -q
